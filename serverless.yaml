service: api-elitegaming
variablesResolutionMode: 20210326
configValidationMode: error
frameworkVersion: '3'

custom:
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'us-east-1'}

provider:
  name: aws
  runtime: nodejs16.x
  lambdaHashingVersion: 20201221
  stage: ${self:custom.stage}
  region: ${self:custom.region}
  # role: ${ssm:/elitegame/PROVIDER_ROLE}
  environment:
    NODE_ENV: ${ssm:/elitegame/NODE_ENV}
    LOG_LEVEL: ${ssm:/elitegame/LOG_LEVEL}
    APP_SECRET: ${ssm:/elitegame/APP_SECRET}
    APP_REFRESH_SECRET: ${ssm:/elitegame/APP_REFRESH_SECRET}
    FRONTEND_URL: ${ssm:/elitegame/FRONTEND_URL}
    DB_HOST: ${ssm:/elitegame/DB_HOST}
    DB_PORT: ${ssm:/elitegame/DB_PORT}
    DB_NAME: ${ssm:/elitegame/DB_NAME}
    DB_PASSWORD: ${ssm:/elitegame/DB_PASSWORD}
    DB_USER: ${ssm:/elitegame/DB_USER}
    DB_MIN_POOL: ${ssm:/elitegame/DB_MIN_POOL}
    DB_MAX_POOL: ${ssm:/elitegame/DB_MAX_POOL}
    TWILLIO_ACCOUNT_SID: ${ssm:/elitegame/TWILLIO_ACCOUNT_SID}
    TWILLIO_AUTH_TOKEN: ${ssm:/elitegame/TWILLIO_AUTH_TOKEN}
    TWILLIO_MESSAGE_SID: ${ssm:/elitegame/TWILLIO_MESSAGE_SID}
    ACCESS_KEY_ID: ${ssm:/elitegame/ACCESS_KEY_ID}
    SECRET_ACCESS_KEY: ${ssm:/elitegame/SECRET_ACCESS_KEY}
    DEFAULT_REGION: ${ssm:/elitegame/DEFAULT_REGION}
    SUPPORT_EMAIL: ${ssm:/elitegame/SUPPORT_EMAIL}
    S3_ASSET_BUCKET: ${ssm:/elitegame/S3_ASSET_BUCKET}
    IPDATA_API_KEY: ${ssm:/elitegame/IPDATA_API_KEY}
    EMAIL_FROM: ${ssm:/elitegame/EMAIL_FROM}
    EMAIL_HOST: ${ssm:/elitegame/EMAIL_HOST}
    EMAIL_PORT: ${ssm:/elitegame/EMAIL_PORT}
    EMAIL_USERNAME: ${ssm:/elitegame/EMAIL_USERNAME}
    EMAIL_PASS: ${ssm:/elitegame/EMAIL_PASS}
    EMAIL_API_KEY: ${ssm:/elitegame/EMAIL_API_KEY}

functions:
  api:
    handler: lambda.handler
    events:
      - http: ANY /
      - http: ANY /{proxy+}
    package:
      include:
        - dist/**
        - package.json
        - lambda.js
        - public/**
      exclude:
        - '*'
        - node_modules/**
        - .github/**
        - __test__/**
        - docs/**
        - knex/**

  reward-worker:
    handler: dist/workers/reward-worker.handler
    timeout: 600
    events:
      - schedule: rate(1 day)
    package:
      include:
        - dist/**
        - package.json
      exclude:
        - '*'
        - node_modules/**
        - .github/**
        - __test__/**
        - docs/**
        - db/**
        - public/**

  coupon-worker:
    handler: dist/workers/coupon-worker.handler
    timeout: 600
    events:
      - schedule: rate(1 day)
    package:
      include:
        - dist/**
        - package.json
      exclude:
        - '*'
        - node_modules/**
        - .github/**
        - __test__/**
        - docs/**
        - db/**
        - public/**

  campaign-worker:
    handler: dist/workers/campaign-worker.handler
    timeout: 600
    events:
      - schedule: rate(60 minutes)
    package:
      include:
        - dist/**
        - package.json
      exclude:
        - '*'
        - node_modules/**
        - .github/**
        - __test__/**
        - docs/**
        - db/**
        - public/**

  # TODO
  # 1. confirm all app's cases
  # 2. split the main parts for gathering the status of aspects
  # 3. ....

  # app-worker:
  #   handler: dist/workers/app-worker.handler
  #   timeout: 600
  #   events:
  #     - schedule: rate(12 hours)
  #   package:
  #     include:
  #       - dist/**
  #       - package.json
  #     exclude:
  #       - '*'
  #       - node_modules/**
  #       - .github/**
  #       - __test__/**
  #       - docs/**
  #       - db/**
  #       - public/**

plugins:
  - serverless-prune-plugin
  - serverless-offline
